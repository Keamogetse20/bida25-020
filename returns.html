<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Veloura | Returns</title>
</head>
<body>
    <!-- Header Section -->
    <header class="site-header">

    <img src="image/logo.png" alt="Veloura Logo" class="logo">

    <div class="header-text">
        <h1>Returns</h1>
        <p> Luxury women's footwear collection. </p>
    </div>
    </header>
<!-- Navigation -->
    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="about.html">About Us</a>
        <a href="feedback.html">Feedback</a>
        <a href="returns.html">Returns</a>
    </nav>
    <div class="container mt-5">
     <form action="acknowledgement.html" method="get">
        <label for="name">Full Name</label>
        <input type="text" class="form-control mb-3" id="name" name="name" required>

        <label for="email">Email Address</label>
        <input type="email" class="form-control mb-3" id="email" name="email" required>

        <label for="product">Product to be returned</label>
        <input type="text" class="form-control mb-3" id="product" name="product" required>
        
        <label for="date">Date of purchase</label>
        <input type="date" class="form-control mb-3" id="date" name="date" required>
      
         <label for="reason">Reason for return</label>
        <textarea id="reason" class="form-control mb-3" name="reason" required></textarea>

        <div class="mt-3 d-flex gap-2">
         <button type="reset" class="btn clear-btn">Clear</button>
         <button type="submit" class="btn submit-btn">Submit</button>
      </div>
    </form>
 </div>     
    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Veloura. All rights reserved. </p>
    </footer>
</body>
</html>
