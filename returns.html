<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Veloura | Returns</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
        }


        form {
            width: 400px;
            margin: auto;
            margin-top: 50px;
            margin-bottom: 50px;
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        textarea {
            height: 120px;
            resize: none;
        }

        .buttons {
            margin-top: 20px;
            text-align: center;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        .submit-btn {
            background-color: #800020;
            color: white;
        }

        .clear-btn {
            background-color: #D4AF37;
            color: black;
            margin-right: 10px;
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <!-- Header Section -->
    <header>
        <h1> Returns </h1>
        <p> Luxury women's footwear. </p>
    </header>
<!-- Navigation -->
    <nav>
        <a href="index.html">Home</a>
        <a href="#">Products</a>
        <a href="about.html">About Us</a>
        <a href="feedback.html">Feedback</a>
        <a href="returns.html">Returns</a>
    </nav>
     <form action="acknowledgement.html" method="get">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required>

        <label for="product">Product to be returned</label>
        <input type="product" id="product" name="name of product" required>
        
        <label for="date">Date of purchase</label>
        <input type="date" id="date" name="date" required>
      
         <label for="reason">Reason for purchase</label>
        <textarea id="reason" name="reason" required></textarea>

        <div class="buttons">
            <button type="reset" class="clear-btn">Clear</button>
            <button type="submit" class="submit-btn">Submit</button>
        </div>
    </form>
    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Veloura. All rights reserved. </p>
    </footer>
</body>
</html>
