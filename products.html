<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Products - Veloura</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="product-page">

<!-- HEADER -->
<header class="header">
  <h1>PRODUCTS</h1>
  <p>Luxury women's footwear collection</p>
</header>

<!-- NAV -->
<nav class="navbar">
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="about.html">About Us</a>
    <a href="feedback.html">Feedback</a>
    <a href="returns.html">Returns</a>
    <!-- Hamburger menu -->
<div class="menu-container">
    <div class="menu-toggle" id="menu-toggle">☰</div>

    <!-- Dropdown Menu -->
    <div class="dropdown-menu" id="dropdown-menu">
        <ul>
            <li>Heels</li>
            <li>Loafers</li>
            <li>Boots</li>
            <li>Sneakers</li>
        </ul>
    </div>
</div>
  </div>
</nav>
  <section class="slideshow-container">

    <button class="prev" id="prevBtn">&#10094;</button>

    <div class="slide-track" id="slide-track">
        <img src="image/slide/shoe1.jpg" class="slide">
        <img src="image/slide/shoe2.jpg" class="slide">
        <img src="image/slide/shoe3.jpg" class="slide">
        <img src="image/slide/shoe4.jpg" class="slide">
        <img src="image/slide/shoe5.jpg" class="slide">
        <img src="image/slide/shoe6.jpg" class="slide">
        <img src="image/slide/shoe7.jpg" class="slide">
        <img src="image/slide/shoe8.jpg" class="slide">
        <img src="image/slide/shoe9.jpg" class="slide">
        <img src="image/slide/shoe10.jpg" class="slide">
        <img src="image/slide/shoe11.jpg" class="slide">
        <img src="image/slide/shoe12.jpg" class="slide">
        <img src="image/slide/shoe13.jpg" class="slide">
        <img src="image/slide/shoe14.jpg" class="slide">
    </div>

    <button class="next" id="nextBtn">&#10095;</button>

</section>
<div class="products-section">

    <!-- LEFT: COLOR FILTER -->
    <div class="color-sidebar">
        <p>Colors</p>
        <ul>
            <li data-color="all">All</li>
            <li data-color="black">Black</li>
            <li data-color="white">White</li>
            <li data-color="red">Red</li>
        </ul>
    </div>

    <!-- RIGHT: PRODUCTS GRID -->
    <div class="product-grid">

        <!-- Example product -->
        <div class="product-card" data-category="heels" data-color="red">
            <img src="image/heels/red1.jpg">
            <h4>Red Heels</h4>
            <p>P350</p>
            <button class="view-btn">View</button>

            <!-- Sizes (hidden) -->
            <div class="sizes">
                <span>36</span>
                <span>37</span>
                <span>38</span>
                <span>39</span>
            </div>
        </div>

        <!-- duplicate for other products -->

    </div>
</div>  
  <script src="script.js"></script>
