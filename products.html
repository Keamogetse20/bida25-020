<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VELOURA - Products</title>

<style>
    /* --- GENERAL --- */
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: #f8f8f8;
        color: #333;
    }

    header {
        background-color: #000;
        color: #fff;
        text-align: center;
        padding: 20px;
    }

    nav {
        background-color: #111;
        text-align: center;
        padding: 12px 0;
    }

    nav a {
        color: #fff;
        margin: 12px;
        text-decoration: none;
        font-weight: bold;
        transition: 0.3s;
    }

    nav a:hover {
        color: gold;
    }

    /* --- LAYOUT --- */
    .container {
        display: flex;
        align-items: flex-start;
        justify-content: flex-start;
    }

    /* --- SIDEBAR --- */
    .sidebar {
        width: 220px;
        background-color: #111;
        transition: 0.3s;
        overflow: hidden;
        border-right: 1px solid #222;
    }

    .sidebar.collapsed {
        margin-left: -220px;
    }

    .sidebar ul {
        list-style: none;
        margin: 0;
        padding: 0;
    }

    .sidebar li {
        border-bottom: 1px solid #222;
    }

    .sidebar a {
        display: block;
        padding: 15px 20px;
        color: #fff;
        text-decoration: none;
        transition: 0.3s;
    }

    .sidebar a:hover {
        background-color: gold;
        color: #000;
    }

    /* --- TOGGLE BUTTON --- */
    .toggle-btn {
        margin: 10px;
        padding: 10px 15px;
        background-color: #000;
        color: #fff;
        border: none;
        cursor: pointer;
        border-radius: 5px;
    }

    /* --- MAIN CONTENT --- */
    .product-area {
        flex: 1;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* --- SLIDER --- */
    .slider {
        position: relative;
        width: 600px;    /* increased width */
        height: 600px;   /* increased height */
        border-radius: 10px;
        overflow: hidden;
        background-color: #000;
    }

    .slide {
        display: none;
        width: 100%;
        height: 100%;
        position: relative;
    }

    .slide img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: brightness(70%);
    }

    .active {
        display: block;
    }

    .slide-text {
        position: absolute;
        bottom: 20px;
        left: 20px;
        color: #fff;
    }

    .slide-text h2 {
        margin: 0 0 5px 0;
        font-size: 22px;
    }

    .slide-text p {
        margin: 0;
        font-size: 18px;
    }

    /* --- SLIDER ARROWS --- */
    .prev, .next {
        position: absolute;
        top: 50%;
        font-size: 28px;
        color: #fff;
        padding: 10px;
        cursor: pointer;
        background-color: rgba(0,0,0,0.5);
        border-radius: 50%;
        user-select: none;
        transform: translateY(-50%);
    }

    .prev { left: 10px; }
    .next { right: 10px; }

    /* --- FOOTER --- */
    footer {
        background-color: #000;
        color: #fff;
        text-align: center;
        padding: 10px;
    }

</style>
</head>

<body>

<header>
    <h1>VELOURA</h1>
    <p>Luxury women's footwear collection</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="#">About Us</a>
    <a href="#">Contact Us</a>
</nav>

<button class="toggle-btn" onclick="toggleSidebar()">☰</button>

<div class="container">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <ul>
            <li><a href="#">Heels</a></li>
            <li><a href="#">Loafers</a></li>
            <li><a href="#">Boots</a></li>
            <li><a href="#">Sandals</a></li>
            <li><a href="#">Sneakers</a></li>
        </ul>
    </aside>

    <!-- Main area (Slider only) -->
    <main class="product-area">

        <div class="slider">

            <div class="slide active">
                <img src="images/Veloura classic heels.jpg">
                <div class="slide-text">
                    <h2>Classic Heels</h2>
                    <p>P300</p>
                </div>
            </div>

            <div class="slide">
                <img src="images/Veloura premium loafers.jpg">
                <div class="slide-text">
                    <h2>Premium Loafers</h2>
                    <p>P200</p>
                </div>
            </div>

            <div class="slide">
                <img src="images/Veloura Royal Boots.jpg">
                <div class="slide-text">
                    <h2>Royal Boots</h2>
                    <p>P600</p>
                </div>
            </div>

            <span class="prev" onclick="changeSlide(-1)">❮</span>
            <span class="next" onclick="changeSlide(1)">❯</span>

        </div>

    </main>

</div>

<footer>
    <p>&copy; 2026 Veloura. All rights reserved.</p>
</footer>

<script>
let index = 0;
const slides = document.querySelectorAll(".slide");

function showSlide(i) {
    slides.forEach(s => s.classList.remove("active"));
    slides[i].classList.add("active");
}

function changeSlide(direction) {
    index += direction;
    if (index >= slides.length) index = 0;
    if (index < 0) index = slides.length - 1;
    showSlide(index);
}

/* Auto slide */
setInterval(() => { changeSlide(1); }, 3000);

/* Sidebar toggle */
function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("collapsed");
}
</script>

</body>
</html>
